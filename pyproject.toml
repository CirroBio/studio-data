[project]
name = "studio-data"
version = "0.1.0"
description = "Publish and read the public example data of the Cirro studios"
requires-python = ">=3.11"
dependencies = ["boto3>=1.36"]

[project.optional-dependencies]
test = ["pytest>=8", "moto[s3,server]>=5.1"]

[project.scripts]
studio-data = "studio_data.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studio_data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
